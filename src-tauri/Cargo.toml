[package]
name = "strata-bar"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ts-rs = "11.1"

[dependencies]
ts-rs = "11.1"
tauri = { version = "2", features = [] }
serde_json = "1"
windows-core = "0.62.2"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_ProcessStatus"] }
